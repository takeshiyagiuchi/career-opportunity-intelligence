[project]
name = "career-opportunity-intelligence"
version = "0.1.0"
description = "An AI-powered career opportunity intelligence platform"
readme = "README.md"
authors = [
    { name = "Takeshi Yagiuchi", email = "t.yagiuchi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coi"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
